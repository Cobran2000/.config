# =========================================================
# 			select shell
# =========================================================

shell /usr/sbin/zsh

# =========================================================
# 			Keybindings
# =========================================================

kitty_mod ctrl+shift

# =========================================================
# 	        	   Theme
# =========================================================

include current-theme.conf

#fonts
font_family Hack Nerd Font
font_size  11

#transparency
background_opacity 0.90
background_blur 1

# =========================================================
#			  Layout
# =========================================================

# The * makes it possible for all layouts to be cicled througt (crtl+shift+L)
enabled_layouts tall,*  


confirm_os_window_close 0
